name: Docs

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "yaab/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs,serve,litellm,yaml,http,rag]'

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # The GitHub Pages source/environment only permits deploys from develop, so
    # publish only on a push to develop. (main still gets a strict build above,
    # and PRs are build-checked — but a push to main must not attempt a deploy,
    # which the environment would reject.)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
